# Despliegue en Fly.io. El volumen persistente es lo que permite usar SQLite
# como base de datos real sin perder los datos entre reinicios.
app = "geest-task-api"
primary_region = "dfw"

[build]
	dockerfile = "Dockerfile"

[env]
	PORT = "3000"
	DATABASE_PATH = "/data/geest.db"
	NOTIFY_MAX_ATTEMPTS = "3"
	NOTIFY_RETRY_BASE_MS = "1000"

[[mounts]]
	source = "geest_data"
	destination = "/data"

[http_service]
	internal_port = 3000
	force_https = true
	auto_stop_machines = "off"
	# SQLite con un único volumen exige exactamente una instancia escritora.
	auto_start_machines = true
	min_machines_running = 1

	[[http_service.checks]]
		interval = "30s"
		timeout = "5s"
		grace_period = "10s"
		method = "GET"
		path = "/health"

[[vm]]
	size = "shared-cpu-1x"
	memory = "256mb"
